hero:
  tag: Decision intelligence for growing businesses
  heading: Map the universe around your decision,
  fadedHeading: then test your move.
  description: Marres brings your business, market and competitors into one traceable model—so you can see what matters, simulate what may happen and decide before scarce capital is committed.
  ariaLabel: A business at the centre of its market universe
  backgroundImage: /images/universe-hero.webp
  coreLabel: YOUR BUSINESS
  orbitLabels:
    - Customers
    - Competitors
    - Market forces
    - Uncertain futures
readout:
  tag: The market readout
  heading: Your decision’s complete
  fadedHeading: system view.
  description: Not another answer in isolation. See the position, pressures, reactions and futures surrounding the choice.
  image: /images/market-system.webp
  imageAlt: A stellar system representing a business and its surrounding market
  imageLabel: MARKET SYSTEM
  metrics:
    - label: POSITION
      value: "6.8"
      suffix: / 10
      note: Behind the strongest peer
      tone: mint
      side: left
    - label: OPPORTUNITY
      value: "8.1"
      suffix: ""
      note: Product strength leads
      tone: blue
      side: left
    - label: COMPETITIVE PRESSURE
      value: Moderate
      suffix: ""
      note: Escalation remains plausible
      tone: blue
      side: right
    - label: ROBUST FUTURES
      value: 92%
      suffix: ""
      note: Strategy survives 92 of 100 tests
      tone: violet
      side: right
method:
  tag: How it works
  heading: Test a decision in three steps.
  description: From a business question to a defensible next move.
  action:
    label: Start a project
    href: https://app.marres.io/register
  steps:
    - number: "1"
      title: Frame the decision
      description: Tell Marres what you are considering, when you must decide, what is at risk and what success means.
      variant: decision
    - number: "2"
      title: Build the market system
      description: Marres connects business facts, market observations and competitor signals, then maps how they interact.
      variant: system
    - number: "3"
      title: Stress-test the move
      description: Compare alternatives across uncertain futures, including competitor reactions, then receive a traceable brief.
      variant: brief
  decisionDemo:
    header: YOUR DECISION
    status: DEFINE
    label: CONSIDERING
    question: Open a second location?
    detail: S$200,000 at risk · Decide by November
  systemDemo:
    header: MARKET SYSTEM
    status: MODEL
    rows:
      - label: DEMAND
        tone: mint
      - label: PRICE
        tone: blue
      - label: SERVICE
        tone: orange
      - label: RISK
        tone: violet
  briefDemo:
    header: DECISION BRIEF
    status: RESULT
    image: /images/decision-planet.webp
    grade: B+
    gradeLabel: ROBUST
    recommendation: Stage the investment. Validate demand before the full lease commitment.
trace:
  tag: The trace
  heading: One decision in,
  fadedHeading: every assumption visible.
  description: Marres preserves the path from what you know to what you choose—so the decision can be reviewed, challenged and reopened.
  records:
    - label: CONTEXT
      tone: mint
      lines:
        - key: decision
          value: '"second location"'
        - key: capital_at_risk
          value: "200000"
        - key: deadline
          value: '"2026-11-01"'
    - label: SIMULATION
      tone: blue
      lines:
        - key: status
          value: '"testing"'
        - key: futures
          value: "100"
        - key: competitor_response
          value: enabled
    - label: RECOMMENDATION
      tone: mint
      lines:
        - key: direction
          value: '"stage investment"'
        - key: robustness
          value: "0.92"
        - key: reopen_if
          value: '"demand falls"'
  benefits:
    - title: Understand the present
      description: Reveal the gaps, mechanisms and opportunities shaping the decision now.
    - title: Simulate what changes
      description: Test actions across market reactions and futures you cannot forecast cleanly.
    - title: Monitor and trace
      description: Watch material signals and preserve assumptions, approvals and outcomes.
pricing:
  tag: Pricing
  heading: Serious decision intelligence,
  fadedHeading: within reach.
  description: Built for businesses too small for enterprise platforms—and making decisions too important to leave untested.
  plans:
    - badge: Monthly
      name: LAUNCH
      price: S$99
      period: / month
      actionLabel: Get started
      href: https://app.marres.io/register
      featured: true
      features:
        - label: Up to 5,000 sources per company for one target and six competitors
        - label: Four Decision Panel decisions per month
        - label: Weekly Marres Brief
          status: Coming soon!
  assurances:
    - Cancel anytime. No lock-in.
    - Research usage remains transparent.
    - Your projects stay private.
continuity:
  tag: Continuity
  heading: Keep the decision alive
  fadedHeading: after the meeting.
  description: A decision is not a slide deck. Marres preserves the reasoning, watches the outside world and tells you when the answer may have changed.
  cards:
    - label: BRIEF
      status: EXPORT
      title: A defensible recommendation
      description: The action, rationale, uncertainties and conditions in one readable record.
    - label: LOOKOUT
      status: MONITOR
      title: Signals that matter
      description: Track competitor and market changes tied to the decision—not generic noise.
    - label: REOPEN
      status: TRACE
      title: Return to what changed
      description: Reopen the decision against its original evidence, assumptions and approvals.
